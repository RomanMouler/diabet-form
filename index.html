<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1d;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 90vh;
            margin: 0;
            gap: 12px;
        }
        input {
            width: 80%;
            max-width: 280px;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus {
            outline: none;
            border-color: #007bff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .btn-container {
            width: 90%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .ok { background-color: #34c759; color: white; }
        .ok:active { background-color: #2da14d; }
        .back { background-color: #3a3a3c; color: #ff453a; }
        .back:active { background-color: #2c2c2e; }
    </style>
</head>
<body>
    <input type="time" id="time">
    <input type="number" id="sugar_blood" step="0.1" placeholder="Сахар (кровь)">
    <input type="number" id="sugar_sensor" step="0.1" placeholder="Сахар (датчик)">
    <input type="text" id="food" placeholder="Пища">
    <input type="number" id="carbs" step="0.1" placeholder="Углеводы">
    <input type="number" id="bolus" step="0.1" placeholder="Болюс">
    <input type="number" id="delay" placeholder="Задержка (мин)">

    <div class="btn-container">
        <button class="ok" onclick="sendData()">ОК</button>
        <button class="back" onclick="tg.close()">Назад</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        function pad(n) { return n.toString().padStart(2, '0'); }
        const now = new Date();
        document.getElementById('time').value = params.get('time') || (pad(now.getHours()) + ':' + pad(now.getMinutes()));
        if (params.get('carbs')) {
            document.getElementById('carbs').value = params.get('carbs');
        }

        function sendData() {
            let data = {
                time: document.getElementById('time').value,
                sugar_blood: document.getElementById('sugar_blood').value,
                sugar_sensor: document.getElementById('sugar_sensor').value,
                food: document.getElementById('food').value,
                carbs: document.getElementById('carbs').value,
                bolus: document.getElementById('bolus').value,
                delay: document.getElementById('delay').value
        };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
